services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlai
      POSTGRES_PASSWORD: mlai
      POSTGRES_DB: ml_affiliate_ai
    ports: ["5432:5432"]
    volumes: [mlai_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  mlai_pg:
